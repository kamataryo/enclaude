services:
  claude:
    # Dockerfile.override があるときは bin/enclaudé が ENCLAUDE_DOCKERFILE を差し替える
    build:
      context: .
      dockerfile: ${ENCLAUDE_DOCKERFILE:-Dockerfile}
    working_dir: ${WORKSPACE:-/workspace}
    volumes:
      # ホストと同じパスにマウントする。履歴は ~/.claude/projects/<cwd> に置かれるので、
      # /workspace 固定だと全プロジェクトの履歴が 1 つに混ざって --resume が使いにくい
      - ${WORKSPACE:-./workspace}:${WORKSPACE:-/workspace}
      # オンボーディング状態とプロジェクト履歴は ~/.claude.json（.claude の外）にあるので
      # ホームごと永続化する。.claude だけだと毎回初回起動になる
      - home:/home/node
      - ${HOME}/.claude/CLAUDE.md:/home/node/.claude/CLAUDE.md:ro
      # entrypoint がこの 2 つをマージして claude --settings に渡す。
      # 書き込まれないので ro の bind mount でよい
      - ./settings.json:/mnt/settings.json:ro
      # ホストの ~/.claude/settings.json から必要な分だけ持ち込むための任意ファイル（git 管理外）
      - ./settings.override.json:/mnt/settings.override.json:ro
    environment:
      # claude-code のバージョンは pnpm-lock.yaml で固定しているので、コンテナ内で
      # 更新されないようにする（更新はロック更新 + 再ビルドで行う）。
      DISABLE_UPDATES: "1"
      # ログイン情報を home ボリュームに平文で永続化させたくない場合の任意ルート。
      # `claude setup-token` で発行した長期トークンをホスト側のシークレット管理から
      # 都度シェルの環境変数として渡せば、ファイルに書かず claude に渡せる（README 参照）
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    stdin_open: true
    tty: true

volumes:
  home:
