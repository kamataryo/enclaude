services:
  claude:
    build: .
    volumes:
      - ${WORKSPACE:-./workspace}:/workspace
      # オンボーディング状態とプロジェクト履歴は ~/.claude.json（.claude の外）にあるので
      # ホームごと永続化する。.claude だけだと毎回初回起動になる
      - home:/home/node
      - ${HOME}/.claude/CLAUDE.md:/home/node/.claude/CLAUDE.md:ro
      # entrypoint が起動のたびに ~/.claude/settings.json へコピーする
      - ./settings.json:/mnt/settings.json:ro
    stdin_open: true
    tty: true

volumes:
  home:
